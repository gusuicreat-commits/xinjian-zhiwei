[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
; Match PendingStore::begin(). Build/upload this image only for deliberate initialization.
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DXJ_FIRMWARE_VERSION=\"0.2.5\"
    -DXJ_IS_TEST_DATA=1

; secrets.h is optional and ignored. Without it the firmware only emits
; serial previews and never fabricates a reading or attempts a network send.
