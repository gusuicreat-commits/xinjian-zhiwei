[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xinjian-zhiwei-simulator"
version = "0.5.0"
description = "Explicit test-data device scenarios for the Xinjian Zhiwei API"
requires-python = ">=3.9"
dependencies = ["httpx>=0.28,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "ruff>=0.9,<1.0"]

[project.scripts]
xinjian-simulator = "xinjian_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xinjian_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
