version: "1"
source_id: legacy.core_trees
scope: {kind: common}
trees:
  - id: sensor-read-failure-example-v1
    title: SHT31 读取失败（待课程确认的示例模板）
    status: placeholder
    enabled: true
    continuity_window_seconds: 3600
    trigger:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 1
        description: 规则诊断已确认传感器读取失败
        params: {error_type: SENSOR_READ_FAILED}
    escalation: &default_escalation
      - {level: 1, min_failure_count: 1, min_duration_seconds: 0}
      - {level: 2, min_failure_count: 3, min_duration_seconds: 300}
      - {level: 3, min_failure_count: 6, min_duration_seconds: 900}
      - {level: 4, min_failure_count: 10, min_duration_seconds: 1800}
    causes:
    - id: wiring.i2c_lines
      title: SDA/SCL 接反或接触不良
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 仅支持存在异常；unknown / need_verification
        params: &id001
          error_type: SENSOR_READ_FAILED
      hints:
        1: 先观察 SDA、SCL 线缆和接插件是否松动。
        2: 断电后按接线表核对 SDA→GPIO8、SCL→GPIO9 与共同地。
        3: 重新插接后只运行最小 I²C 读取程序并保留串口输出。
        4: 保留接线照片和失败日志，请教师协助。
    - id: wiring.power_ground
      title: 供电或地线异常
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 仅支持存在异常；unknown / need_verification
        params: *id001
      hints:
        1: 检查 3.3V、GND 与模块供电指示。
        2: 断电后用万用表核对供电和共同参考。
        3: 恢复供电后观察是否仍有 SHT31_READ_FAILED。
        4: 请教师协助进行电气测量。
    - id: wiring.address_mismatch
      title: ADDR 地址与程序不符
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 地址缺失或不符不能单独确定根因；unknown / need_verification
        params: *id001
      hints:
        1: 核对 ADDR 电平与地址 0x44/0x45。
        2: 对照程序中的 SHT31_ADDR=0x44。
        3: 记录地址扫描或失败日志后再请求教师复核。
        4: 保留 ADDR、地址扫描和失败日志，请教师协助；地址匹配不证明接线正确。
    - id: wiring.pullup_or_length
      title: 上拉不足或 I²C 线过长
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 只能提出待验证候选；unknown / need_verification
        params: *id001
      hints:
        1: 检查 SDA/SCL 是否有合适上拉。
        2: 缩短线缆并按资料评估各线电容。
        3: 逐项记录改变后的读数或失败日志。
        4: 请教师确认允许的电气测量和上拉方案。
    - id: software.i2c_config
      title: 程序引脚或端口配置不符
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 当前程序不自报引脚；仅有失败日志不能区分；unknown / need_verification
        params: *id001
      hints:
        1: 查看代码是否使用 GPIO8/GPIO9、I²C0 与 100 kHz。
        2: 对照实验包核对 0x44、0x2400 和 20 ms 等待。
        3: 保存源码版本和串口桥输入日志。
        4: 请教师协助复核构建与端口配置。
    - id: hardware.sensor_failure
      title: SHT31 传感器本体异常
      evidence:
      - fact: diagnosis_error_count
        operator: gte
        value: 1
        weight: 20
        description: 仅支持存在异常，不证明器件损坏；unknown / need_verification
        params: *id001
      hints:
        1: 不要仅凭读取失败判定传感器损坏。
        2: 先完成供电、线路、地址和程序配置核对。
        3: 使用已知正常的同型号器件做对照测试。
        4: 由教师确认后再更换器件。

  - id: led-no-light-example-v1
    title: LED 不亮（待课程确认的示例模板）
    status: placeholder
    enabled: true
    continuity_window_seconds: 3600
    trigger:
      - &led_root_trigger
        fact: log_event_count
        operator: gte
        value: 1
        weight: 1
        description: 日志存在 LED 无响应事件
        params: {event_code: LED_NO_RESPONSE}
    escalation: *default_escalation
    causes:
      - id: led-connection-direction
        title: 发光器件连接方向或连接关系不符
        evidence:
          - <<: *led_root_trigger
            weight: 20
            description: 仅有 LED 无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在输出连接检查证据
            params: {event_code: OUTPUT_CONNECTION_SUSPECTED}
        hints:
          1: 先检查器件连接方向。
          2: 对照实验接线图确认连接方向和连接关系。
          3: 断电后逐段复核连接，并在恢复供电后重新测试。
          4: 保留接线照片和测试日志，请教师协助检查电路连接。
      - id: led-output-configuration
        title: 输出配置与实验模板不一致
        evidence:
          - <<: *led_root_trigger
            weight: 20
            description: 仅有 LED 无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在通用输出配置异常证据
            params: {event_code: OUTPUT_CONFIGURATION_MISMATCH}
        hints:
          1: 检查软件输出配置方向。
          2: 对照实验模板确认输出映射、模式和有效电平配置。
          3: 分别验证初始化和状态切换路径，记录实际输出状态。
          4: 提交配置快照与日志，请教师协助核对实验模板。
      - id: led-circuit-power
        title: 输出回路供电异常
        evidence:
          - <<: *led_root_trigger
            weight: 20
            description: 仅有 LED 无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在输出回路供电异常证据
            params: {event_code: OUTPUT_POWER_UNSTABLE}
        hints:
          1: 检查输出回路供电方向。
          2: 检查公共参考连接和实验要求的供电条件。
          3: 断电检查回路完整性，再按实验安全要求逐段验证。
          4: 停止反复通电，保留现场并请求教师介入。

  - id: button-no-response-example-v1
    title: 按键无反应（待课程确认的示例模板）
    status: placeholder
    enabled: true
    continuity_window_seconds: 3600
    trigger:
      - &button_root_trigger
        fact: log_event_count
        operator: gte
        value: 1
        weight: 1
        description: 日志存在按键无响应事件
        params: {event_code: BUTTON_NO_RESPONSE}
    escalation: *default_escalation
    causes:
      - id: button-connection
        title: 输入连接不完整
        evidence:
          - <<: *button_root_trigger
            weight: 20
            description: 仅有按键无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在输入连接异常证据
            params: {event_code: INPUT_CONNECTION_SUSPECTED}
        hints:
          1: 先检查输入连接方向。
          2: 对照实验接线图检查按键回路和公共参考连接。
          3: 断电后逐段检查连接连续性，再恢复测试。
          4: 保留接线状态与日志，请教师协助确认输入回路。
      - id: button-input-configuration
        title: 输入模式或映射配置不一致
        evidence:
          - <<: *button_root_trigger
            weight: 20
            description: 仅有按键无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在通用输入配置异常证据
            params: {event_code: INPUT_CONFIGURATION_MISMATCH}
        hints:
          1: 检查软件输入配置方向。
          2: 对照实验模板确认输入映射、模式和有效状态配置。
          3: 记录原始输入状态并分别验证初始化与事件处理路径。
          4: 提交配置快照和输入日志，请教师协助核对模板。
      - id: button-signal-conditioning
        title: 输入信号稳定条件不满足
        evidence:
          - <<: *button_root_trigger
            weight: 20
            description: 仅有按键无响应根事件，只支持低置信候选
          - fact: log_event_count
            operator: gte
            value: 1
            weight: 55
            description: 日志存在输入信号不稳定证据
            params: {event_code: INPUT_SIGNAL_UNSTABLE}
        hints:
          1: 检查输入信号稳定性方向。
          2: 对照实验模板检查输入稳定条件与事件判定设置。
          3: 采集连续原始输入状态，区分无变化与快速抖动。
          4: 保留连续输入记录，请教师协助判断硬件或软件原因。
