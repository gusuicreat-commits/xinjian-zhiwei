cases:
- id: sht31.sensor-read-failed.v1
  experimentType: sht31_temperature_humidity
  errorType: SENSOR_READ_FAILED
  symptom: 测试数据：窗口内累计出现读取失败事件，不能推断连续失败、无读数或具体根因。
  normalState:
    requirements:
    - 有来源的温湿度读数
    - 周期、新鲜度和课程判据待实测
    - 无异常命中不等于硬件正常
    verification_status: unverified
  evidence:
  - evidenceType: sensor.read_failed
    description: 窗口内累计出现标准读取失败事件，不代表连续失败
  possibleCauses:
  - wiring.i2c_lines
  - wiring.power_ground
  - wiring.address_mismatch
  - wiring.pullup_or_length
  - software.i2c_config
  - hardware.sensor_failure
  solutionSteps:
  - 断电核对 SDA→GPIO8、SCL→GPIO9、3.3V、GND 与 ADDR。
  - 核对 I²C0、0x44/0x45、上拉、线长与程序构建。
  - 关闭 COMTool 后运行串口桥并保留 HTTP 回执；仍失败请教师协助。
