cases:
  - id: led.output-failed.confirmed.v2
    experimentType: gpio_led_output
    errorType: GPIO_EXPECTATION_FAILED
    symptom: 程序执行点亮操作后，LED 状态没有变化。
    normalState: {gpio2: 高电平, led: 点亮}
    evidence:
      - {evidenceType: led.output_level, description: 观测电平与期望状态不一致}
    possibleCauses:
      - software.output_configuration
      - wiring.led_polarity
      - hardware.led_failure
    solutionSteps:
      - 核对 GPIO2、输出模式与有效电平。
      - 断电后检查 LED 极性、限流电阻和公共地。
      - 用最小亮灭程序做对照测试。
    teacherNotes: 不应只凭 LED 不亮直接判定器件损坏。
    rootCauseValue: software.output_configuration
    rootCauseStatus: confirmed
