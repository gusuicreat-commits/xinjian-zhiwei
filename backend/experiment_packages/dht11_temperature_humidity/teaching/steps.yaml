steps:
- step_id: connect
  title: 按接线表连接 DHT11
  expected_state: 断电，按原厂图核对四针裸DHT11观察方向和脚号，再比对3.3V、共同GND、DATA→GPIO4及4.7kΩ上拉，NC不接；保存接线照片和器件标识。预期仅是接线表与实物对应，通电效果仍待记录。
  prerequisite_step_ids:
  - identify
- step_id: configure
  title: 配置代码
  expected_state: 核对统一固件、设备协议V1、GPIO4及3秒项目请求周期（满足厂商严格大于2秒）；记录构建版本。仅本地观察与已配置上传身份是不同模式；首次有效帧不发布未知前序转换的温湿度，失败或存储阻塞须保留原始日志。
  prerequisite_step_ids:
  - identify
- step_id: observe
  title: 观察串口数据
  expected_state: 按时间顺序记录心跳、有效读数或读取失败日志，并区分串口预览与平台接收。保存操作前后记录及版本，只有驱动返回有效帧时才有温湿度；无读数或缺判据保持unknown。新数据到达后可按现有重新检查流程分析，不把结果记录当独立测量或自动确认恢复。
  prerequisite_step_ids:
  - identify
- step_id: identify
  title: 回看设备身份和实验版本
  expected_state: 核对实物型号、固件版本、设备标识、活动会话及固定包版本，记录采集方式和测试标记；缺身份/版本时先标明缺口，不把旧会话记录用于本次判断。细节见内部实验指南第2、5节。
