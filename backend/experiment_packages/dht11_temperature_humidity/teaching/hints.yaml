hints:
- cause_id: wiring.data_pin_mismatch
  levels:
    1: 检查连线是否松动。
    2: 断电后逐项核对接线。
    3: 测量供电并运行最小程序。
    4: 保留现场并请求教师帮助。
- cause_id: software.gpio_mismatch
  levels:
    1: 检查代码引脚。
    2: 核对 示例 GPIO4（pending_hardware） 和 DHT11 类型。
    3: 核对初始化和采样间隔。
    4: 提交代码请教师复核。
- cause_id: hardware.sensor_failure
  levels:
    1: 先不要判定器件损坏。
    2: 排除接线和配置。
    3: 做同型号器件对照测试。
    4: 由教师确认更换。
