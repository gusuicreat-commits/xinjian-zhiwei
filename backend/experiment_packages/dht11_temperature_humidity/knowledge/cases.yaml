cases:
- id: dht11.sensor-read-failed.test-data.v2_0_2
  experimentType: dht11_temperature_humidity
  errorType: SENSOR_READ_FAILED
  symptom: 测试数据：窗口内累计出现读取失败事件，不能推断连续失败、无读数或具体根因。
  normalState:
    requirements:
    - 心跳在配置时限内
    - 温度和湿度均有效且按已配置周期到达
    - 无异常规则命中
    verification_status: unverified
  evidence:
  - evidenceType: sensor.read_failed
    description: 窗口内累计出现标准读取失败事件，不代表连续失败
  possibleCauses:
  - wiring.data_pin_mismatch
  - software.gpio_mismatch
  - hardware.sensor_failure
  solutionSteps:
  - 断电后核对 3.3V、GND、DATA→GPIO4 和 4.7kΩ 外部上拉。
  - 核对代码中的 GPIO、DHT11 类型和采样间隔。
  - 仍失败时用已知正常传感器做对照测试。
