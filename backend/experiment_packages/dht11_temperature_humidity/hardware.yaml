hardware:
  family: esp32
  board_model: esp32-devkit
  components:
  - id: dht11
    kind: temperature_humidity_sensor
    model: dht11
    metadata:
      verification_status: pending_hardware
      source_type: project_design
      is_test_data: true
interfaces:
- id: dht11_gpio
  type: gpio
  component_ids:
  - dht11
  pins:
    data: 4
  parameters:
    mode: input_pullup
    minimum_interval_ms: 2000
    verification_status: pending_hardware
connections:
- component: dht11
  signal: DATA
  target: GPIO4
evidence_mapping:
- source:
    type: device_error_code
    value: DHT11_READ_FAILED
  evidence_type: sensor.read_failed
- source:
    type: sensor_reading
    value: temperature
  evidence_type: observation.temperature
- source:
    type: sensor_reading
    value: humidity
  evidence_type: observation.humidity
normalization:
  adapter: mapping
  mappings:
  - id: dht11-read-failed
    match:
      error_code: DHT11_READ_FAILED
    output: event
    component_id: dht11
    interface_id: dht11_gpio
    event_type: sensor.read_failed
    timestamp_field: timestamp
    default_status: error
  - id: dht11-temperature
    match:
      sensor: dht11
      metric: temperature
    output: observation
    component_id: dht11
    interface_id: dht11_gpio
    metric: temperature
    value_field: value
    timestamp_field: timestamp
    default_status: normal
  - id: dht11-humidity
    match:
      sensor: dht11
      metric: humidity
    output: observation
    component_id: dht11
    interface_id: dht11_gpio
    metric: humidity
    value_field: value
    timestamp_field: timestamp
    default_status: normal
required_parameters:
  data_pin: 4
  sensor_type: DHT11
  minimum_interval_ms: 2000
  verification_status: pending_hardware
  notes: 引脚、电路、采样参数为未验证示例；不得当作正式接线或教师经验。
  consecutive_failure_threshold: null
  consecutive_failure_status: pending_hardware
  truth_status:
    final_gpio:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:interfaces.pins
      required_confirmation: 实物型号、原理图和接线核验；当前 GPIO 仅是示例
    heartbeat_period:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:runtime_expectations
      required_confirmation: 实测发送周期与课程容差；90 秒是当前监测时限，不是发送周期
    reading_period_and_timeout:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:runtime_expectations.required_observations
      required_confirmation: 真实采样周期、时间戳与允许间隔；未确认前 maximum_age_seconds 留空
    teacher_experience:
      status: pending_teacher
      source_type: project_design
      source_ref: knowledge/cases.yaml:teacherNotes
      required_confirmation: 教师本人提供可追溯依据并审核；没有材料时保持 null
    real_student_cases:
      status: pending_teacher
      source_type: project_design
      source_ref: knowledge/cases.yaml:facts
      required_confirmation: 真实课堂记录、原始证据、实际修复动作和教师审核；不得把合成案例改名充当真实案例
    teaching_acceptance:
      status: pending_course_confirmation
      source_type: project_design
      source_ref: teaching/steps.yaml
      required_confirmation: 课程指导书版次、验收要求、允许误差和观察时长
    teaching_actions_and_escalation:
      status: pending_teacher
      source_type: project_design
      source_ref: teaching/hints.yaml; diagnosis/fault_tree.yaml:escalation
      required_confirmation: 教师确认排查步骤、测量权限和提示升级门槛
    fault_log_behavior:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:normalization.mappings
      required_confirmation: 逐项真实故障注入及日志；DHT11_READ_FAILED 当前是示例契约
    failure_threshold:
      status: pending_hardware
      source_type: project_design
      source_ref: diagnosis/rules.yaml:rules[0].conditions[0].value
      required_confirmation: 窗口累计阈值 5 待实测校准；连续失败阈值保持 null，课程同时确认可接受误报
    fault_distinguishability:
      status: pending_hardware
      source_type: project_design
      source_ref: diagnosis/fault_tree.yaml
      required_confirmation: 对照不同故障的实测证据；同表现保留 unknown / need_verification
runtime_expectations:
  verification_status: pending_hardware
  offline_after_seconds: 90
  heartbeat_maximum_age_seconds: 90
  required_observations:
  - component_id: dht11
    metric: temperature
    maximum_age_seconds: null
  - component_id: dht11
    metric: humidity
    maximum_age_seconds: null
