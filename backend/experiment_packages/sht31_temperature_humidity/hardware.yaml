hardware:
  family: esp32
  board_model: esp32-s3-n16r8
  components:
  - id: sht31
    kind: temperature_humidity_sensor
    model: SHT31
    metadata:
      verification_status: pending_hardware
      source_type: project_design
      is_test_data: true
      supply_voltage_v: 3.3
      address_default: 0x44
      address_alternate: 0x45
      bus: i2c
interfaces:
- id: sht31_i2c
  type: i2c
  component_ids: [sht31]
  pins:
    sda: 8
    scl: 9
  parameters:
    address: 0x44
    frequency_hz: 100000
    measurement_command: 0x2400
    configured_sample_interval_ms: 1000
    verification_status: pending_hardware
connections:
- component: sht31
  signal: SDA
  target: GPIO8
- component: sht31
  signal: SCL
  target: GPIO9
evidence_mapping:
- source:
    type: device_error_code
    value: SHT31_READ_FAILED
  evidence_type: sensor.read_failed
- source:
    type: sensor_reading
    value: temperature
  evidence_type: observation.temperature
- source:
    type: sensor_reading
    value: humidity
  evidence_type: observation.humidity
normalization:
  adapter: mapping
  mappings:
  - id: sht31-read-failed
    match:
      event_code: SHT31_READ_FAILED
    output: event
    component_id: sht31
    interface_id: sht31_i2c
    event_type: sensor.read_failed
    timestamp_field: occurredAt
    default_status: error
  - id: sht31-temperature
    match:
      sensor_type: SHT31
      metric_key: temperature
    output: observation
    component_id: sht31
    interface_id: sht31_i2c
    metric: temperature
    value_field: value
    timestamp_field: occurredAt
    default_status: normal
  - id: sht31-humidity
    match:
      sensor_type: SHT31
      metric_key: humidity
    output: observation
    component_id: sht31
    interface_id: sht31_i2c
    metric: humidity
    value_field: value
    timestamp_field: occurredAt
    default_status: normal
required_parameters:
  sda_pin: 8
  scl_pin: 9
  sensor_type: SHT31
  address: 0x44
  alternate_address: 0x45
  bus_frequency_hz: 100000
  measurement_command: 0x2400
  configured_sample_interval_ms: 1000
  verification_status: pending_hardware
  notes: ESP32-S3-N16R8 通过电脑端串口桥接入；源码当前使用 GPIO8/GPIO9、0x44、100 kHz、0x2400 单次测量并等待 20 ms。接线、精度、周期与故障可区分性仍待实测。
  consecutive_failure_threshold: null
  consecutive_failure_status: pending_hardware
  truth_status:
    i2c_pins_and_address:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:interfaces.sht31_i2c
      required_confirmation: 实物型号、原理图、SDA/SCL、ADDR 与地址逐项核验
    reading_period_and_timeout:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:runtime_expectations
      required_confirmation: 真实采样周期、串口接收时间与允许间隔；maximum_age_seconds 留空
    teacher_experience:
      status: pending_teacher
      source_type: project_design
      source_ref: knowledge/cases.yaml
      required_confirmation: 教师本人提供可追溯依据并审核
    real_student_cases:
      status: pending_teacher
      source_type: project_design
      source_ref: knowledge/cases.yaml
      required_confirmation: 真实课堂记录、原始证据、实际修复动作和教师审核
    teaching_acceptance:
      status: pending_course_confirmation
      source_type: project_design
      source_ref: teaching/steps.yaml
      required_confirmation: 课程指导书版次、验收要求、允许误差和观察时长
    teaching_actions_and_escalation:
      status: pending_teacher
      source_type: project_design
      source_ref: teaching/hints.yaml; diagnosis/fault_tree.yaml
      required_confirmation: 教师确认排查步骤、测量权限和提示升级门槛
    fault_log_behavior:
      status: pending_hardware
      source_type: project_design
      source_ref: hardware.yaml:normalization.mappings
      required_confirmation: 逐项真实故障注入及串口桥日志；SHT31_READ_FAILED 当前是协议契约
    failure_threshold:
      status: pending_hardware
      source_type: project_design
      source_ref: diagnosis/rules.yaml
      required_confirmation: 窗口累计阈值 5 待实测校准
    fault_distinguishability:
      status: pending_hardware
      source_type: project_design
      source_ref: diagnosis/fault_tree.yaml
      required_confirmation: 对照不同 I2C 故障的实测证据；同表现保持 unknown / need_verification
runtime_expectations:
  verification_status: pending_hardware
  offline_after_seconds: 90
  heartbeat_maximum_age_seconds: null
  required_observations:
  - component_id: sht31
    metric: temperature
    maximum_age_seconds: null
  - component_id: sht31
    metric: humidity
    maximum_age_seconds: null
