cases:
- name: 窗口累计失败触发读取异常
  facts:
    failure_count_in_window: 5
  expected:
    error_type: SENSOR_READ_FAILED
    candidate_causes: &id001
    - wiring.i2c_lines
    - wiring.power_ground
    - wiring.address_mismatch
    - wiring.pullup_or_length
    - software.i2c_config
    - hardware.sensor_failure
- name: 更高累计失败仍不等于连续失败
  facts:
    failure_count_in_window: 20
  expected:
    error_type: SENSOR_READ_FAILED
    candidate_causes: *id001
