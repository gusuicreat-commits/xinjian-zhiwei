[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xinjian-zhiwei-backend"
version = "1.0.0"
description = "FastAPI backend for the Xinjian Zhiwei embedded-lab analysis platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.1,<3.2",
  "pyyaml>=6.0,<7.0",
  "pypdf>=5.0,<7.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.diagnosis" = ["rules/**/*.yaml", "fault_trees/**/*.yaml"]
"app.experiments" = ["definitions/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
# Keep the existing annotation/style baseline while the runtime minimum is 3.10.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/20260730_0015_simplify_rbac_roles.py" = ["I001"]
