name: xinjian-zhiwei

services:
  postgres:
    # The immutable historical migrations create the vector extension.
    # Keep this image for clean-database upgrades; the MVP performs no vector retrieval.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS:-90}
      DEVICE_PROTOCOL_VERSION: ${DEVICE_PROTOCOL_VERSION:-1.0}
      DEVICE_SCHEMA_VERSION: ${DEVICE_SCHEMA_VERSION:-1}
      DEVICE_INGEST_MAX_RECORDS: ${DEVICE_INGEST_MAX_RECORDS:-100}
      DEVICE_INGEST_MAX_BODY_BYTES: ${DEVICE_INGEST_MAX_BODY_BYTES:-262144}
      DEVICE_INGEST_REQUESTS_PER_MINUTE: ${DEVICE_INGEST_REQUESTS_PER_MINUTE:-120}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      REVIEW_ACCESS_TOKEN: ${REVIEW_ACCESS_TOKEN:-}
      KNOWLEDGE_CHUNK_SIZE_CHARS: ${KNOWLEDGE_CHUNK_SIZE_CHARS:-1200}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-150}
      KNOWLEDGE_MAX_DOCUMENT_CHARS: ${KNOWLEDGE_MAX_DOCUMENT_CHARS:-500000}
      KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-10485760}
      AI_TRANSPORT: ${AI_TRANSPORT:-openai-compatible}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_THINKING_ENABLED: ${AI_THINKING_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-phase9.5-v1}
      AI_REQUIRE_KNOWLEDGE: ${AI_REQUIRE_KNOWLEDGE:-true}
      AI_KNOWLEDGE_LIMIT: ${AI_KNOWLEDGE_LIMIT:-5}
      AI_MAX_CONTEXT_ITEMS: ${AI_MAX_CONTEXT_ITEMS:-50}
      AI_MAX_LOG_ITEMS: ${AI_MAX_LOG_ITEMS:-6}
      AI_KNOWLEDGE_CONTENT_MAX_CHARS: ${AI_KNOWLEDGE_CONTENT_MAX_CHARS:-1000}
      DIAGNOSIS_EPISODE_WINDOW_SECONDS: ${DIAGNOSIS_EPISODE_WINDOW_SECONDS:-300}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_LOCAL_ENABLED: ${AI_LOCAL_ENABLED:-false}
      AI_CLOUD_ENABLED: ${AI_CLOUD_ENABLED:-false}
      AI_LOCAL_PROVIDER: ${AI_LOCAL_PROVIDER:-}
      AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
      AI_LOCAL_MODEL: ${AI_LOCAL_MODEL:-}
      AI_LOCAL_API_KEY: ${AI_LOCAL_API_KEY:-}
      AI_CLOUD_PROVIDER: ${AI_CLOUD_PROVIDER:-}
      AI_CLOUD_BASE_URL: ${AI_CLOUD_BASE_URL:-}
      AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
      AI_CLOUD_API_KEY: ${AI_CLOUD_API_KEY:-}
      AI_CALLS_PER_EPISODE: ${AI_CALLS_PER_EPISODE:-2}
      AI_CALLS_PER_DEVICE_HOUR: ${AI_CALLS_PER_DEVICE_HOUR:-4}
      AI_DAILY_BUDGET_CNY: ${AI_DAILY_BUDGET_CNY:-}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-4000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AI_OUTPUT_LANGUAGE: ${AI_OUTPUT_LANGUAGE:-zh-CN}
      AI_MAX_COST_PER_CALL: ${AI_MAX_COST_PER_CALL:-}
      AI_LOW_CONFIDENCE_THRESHOLD: ${AI_LOW_CONFIDENCE_THRESHOLD:-0.65}
      AI_INPUT_COST_PER_1K_TOKENS: ${AI_INPUT_COST_PER_1K_TOKENS:-}
      AI_OUTPUT_COST_PER_1K_TOKENS: ${AI_OUTPUT_COST_PER_1K_TOKENS:-}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-86400}
      AI_SCHEMA_VERSION: ${AI_SCHEMA_VERSION:-phase9-light-v1}
      DIAGNOSIS_WORKFLOW_ENABLED: ${DIAGNOSIS_WORKFLOW_ENABLED:-true}
      DIAGNOSIS_GRAPH_VERSION: ${DIAGNOSIS_GRAPH_VERSION:-langgraph-v2}
      DIAGNOSIS_CHECKPOINT_BACKEND: ${DIAGNOSIS_CHECKPOINT_BACKEND:-memory}
      DIAGNOSIS_CHECKPOINT_DSN: ${DIAGNOSIS_CHECKPOINT_DSN:-}
      DIAGNOSIS_CHECKPOINT_SETUP: ${DIAGNOSIS_CHECKPOINT_SETUP:-false}
      DIAGNOSIS_TEACHER_REVIEW_SCORE: ${DIAGNOSIS_TEACHER_REVIEW_SCORE:-0.55}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
