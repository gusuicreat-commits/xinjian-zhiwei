name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Required by immutable historical migrations, not by the MVP diagnosis path.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xinjian_ci
          POSTGRES_USER: xinjian_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xinjian_ci -d xinjian_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://xinjian_ci:ci-password-not-for-production@127.0.0.1:5432/xinjian_ci
      TEST_DIAGNOSIS_CHECKPOINT_DSN: postgresql://xinjian_ci:ci-password-not-for-production@127.0.0.1:5432/xinjian_ci
      XINJIAN_EVAL_POSTGRES_DSN: postgresql://xinjian_ci:ci-password-not-for-production@127.0.0.1:5432/xinjian_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install pytest pytest-cov ruff tomli
          python -m pip install --no-deps -e backend
      - name: Install simulator
        run: python -m pip install --no-deps -e simulator
      - name: Prepare isolated test database
        run: python scripts/prepare_evaluation_postgres.py
      - name: Python checks
        run: |
          ruff check backend simulator scripts/prepare_evaluation_postgres.py
          pytest backend/tests simulator/tests
          PYTHONPATH=backend python -m app.cli.run_synthetic_evaluation
          PYTHONPATH=backend python -m app.cli.verify_experiment_packages
          PYTHONPATH=backend python -m app.cli.verify_structured_knowledge
          PYTHONPATH=backend python -m app.cli.verify_v2_evidence_workflow
          python scripts/check_version.py
          scripts/security_scan.sh
      - name: PostgreSQL workflow evaluation
        if: ${{ !cancelled() }}
        run: >-
          PYTHONPATH=backend python -m app.cli.run_workflow_evaluation
          --postgres --output output/workflow-evaluation/ci-postgres.json
      - name: Show workflow summary
        if: always()
        run: |
          if [ -f output/workflow-evaluation/ci-postgres.md ]; then
            cat output/workflow-evaluation/ci-postgres.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve workflow evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evaluation-postgres
          path: output/workflow-evaluation/
          if-no-files-found: warn
          retention-days: 14
      - name: Migration checks
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          alembic check
          DIAGNOSIS_CHECKPOINT_BACKEND=postgres DIAGNOSIS_CHECKPOINT_DSN="$TEST_DIAGNOSIS_CHECKPOINT_DSN" python -m app.cli.setup_diagnosis_checkpoints
          DIAGNOSIS_CHECKPOINT_BACKEND=postgres DIAGNOSIS_CHECKPOINT_DSN="$TEST_DIAGNOSIS_CHECKPOINT_DSN" python -m app.cli.setup_diagnosis_checkpoints
          pytest tests/test_diagnosis_checkpoint_postgres.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run test -- --run
          npm run build
          npx playwright install --with-deps chrome chromium
          npm run test:e2e
      - name: Browser and real backend integration
        working-directory: frontend
        run: BACKEND_PYTHON="$(command -v python)" npm run test:e2e:integration
      - name: Preserve browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
