name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xinjian_ci
          POSTGRES_USER: xinjian_ci
          POSTGRES_PASSWORD: ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xinjian_ci -d xinjian_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://xinjian_ci:ci-password-not-for-production@127.0.0.1:5432/xinjian_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install pytest pytest-cov ruff tomli
          python -m pip install --no-deps -e backend
      - name: Install simulator
        run: python -m pip install --no-deps -e simulator
      - name: Python checks
        run: |
          ruff check backend simulator
          pytest backend/tests simulator/tests
          PYTHONPATH=backend python -m app.cli.run_synthetic_evaluation
          python scripts/check_version.py
          scripts/security_scan.sh
      - name: Migration checks
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run test -- --run
          npm run build
          npx playwright install --with-deps chrome
          npm run test:e2e
