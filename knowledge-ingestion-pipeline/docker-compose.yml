services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-ingestion-postgres
    environment:
      POSTGRES_DB: knowledge_ingestion
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "55432:5432"
    volumes:
      - knowledge_ingestion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  knowledge_ingestion_pgdata:
    name: knowledge_ingestion_pgdata
