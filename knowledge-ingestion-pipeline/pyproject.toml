[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ingestion-pipeline"
version = "0.1.0"
description = "Structure-aware local knowledge ingestion and pgvector retrieval MVP"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running pgvector database",
  "model: downloads/loads the real embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
